<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Star School Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#1e293b}
header{background:#102a43;color:white;padding:25px;text-align:center}
header h1{margin:0;font-size:25px}
header p{color:#b8dce0}
.login{max-width:380px;margin:55px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 20px #0002}
h2{text-align:center;color:#087e83}
input,button{width:100%;padding:13px;margin:10px 0;border:1px solid #ddd;border-radius:6px}
button{background:#087e83;color:white;border:0;font-weight:bold;cursor:pointer}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>
<body>
<header>
<h1>Moon Star Public High School</h1>
<p>Khanwahan | School Management System</p>
</header><div class="login">
<h2>Admin Login</h2>
<input type="text" placeholder="Admin Username">
<input type="password" placeholder="Password">
<button onclick="alert('Secure login system will be connected next.')">Login</button>
</div><footer>© 2026 Moon Star School Management System</footer>
</body>
</html>
