<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Star School Management System</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial;
 background:#f1f5f9;
 color:#1e293b;
}

header{
 background:#102a43;
 color:white;
 padding:25px;
 text-align:center;
}

header h1{margin:0;font-size:25px}
header p{color:#b8dce0}

.login{
 max-width:380px;
 margin:55px auto;
 background:white;
 padding:30px;
 border-radius:12px;
 box-shadow:0 5px 20px #0002;
}

h2{text-align:center;color:#087e83}

input,button{
 width:100%;
 padding:13px;
 margin:10px 0;
 border:1px solid #ddd;
 border-radius:6px;
}

button{
 background:#087e83;
 color:white;
 border:0;
 font-weight:bold;
 cursor:pointer;
}

a{
 color:#087e83;
 cursor:pointer;
 text-decoration:none;
}

#message{
 text-align:center;
 font-size:14px;
}

#dashboard{
 display:none;
 max-width:600px;
 margin:40px auto;
 background:white;
 padding:30px;
 border-radius:12px;
 text-align:center;
}

#resetBox,#dashboard{display:none}

footer{
 text-align:center;
 padding:20px;
 color:#64748b;
}
</style>
</head>

<body>

<header>
<h1>Moon Star Public High School</h1>
<p>Khanwahan | School Management System</p>
</header>

<div class="login" id="loginBox">

<h2>Admin Login</h2>

<input type="email" id="email"
placeholder="Admin Email">

<input type="password" id="password"
placeholder="Password">

<button onclick="adminLogin()">Login</button>

<p style="text-align:center">
<a onclick="forgotPassword()">Forgot Password?</a>
</p>

<p id="message"></p>

</div>

<div class="login" id="resetBox">

<h2>Reset Password</h2>

<input type="password" id="newPassword"
placeholder="New Password">

<input type="password" id="confirmPassword"
placeholder="Confirm Password">

<button onclick="updatePassword()">
Update Password
</button>

<p id="resetMessage"></p>

</div>

<div id="dashboard">

<h2>Welcome Admin!</h2>

<p>Moon Star School Management System</p>

<p id="adminEmail"></p>

<button onclick="logout()">Logout</button>

</div>

<footer>
© 2026 Moon Star School Management System
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://tglaxwhmfqtrdbtxdyqf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yTkulDMTToWewAH7DbYfyw_uW8H2dAm";

const client = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const redirectURL = window.location.origin +
window.location.pathname;

function message(text,color="red"){
document.getElementById("message").style.color=color;
document.getElementById("message").innerText=text;
}

async function adminLogin(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email || !password){
message("Email aur Password enter karein.");
return;
}

const {data,error}=await client.auth.signInWithPassword({
email,password
});

if(error){
message(error.message);
return;
}

if(data.user.email.toLowerCase() !==
"ashfaque.thebo@gmail.com"){
await client.auth.signOut();
message("Unauthorized Admin Account.");
return;
}

showDashboard(data.user);

}

async function forgotPassword(){

const email=document.getElementById("email").value.trim();

if(!email){
message("Pehle Admin Email enter karein.");
return;
}

const {error}=await client.auth.resetPasswordForEmail(
email,
{redirectTo:redirectURL}
);

if(error){
message(error.message);
return;
}

message("Password reset link Gmail par bhej diya gaya.","green");

}

function showDashboard(user){

document.getElementById("loginBox").style.display="none";
document.getElementById("resetBox").style.display="none";
document.getElementById("dashboard").style.display="block";

document.getElementById("adminEmail").innerText=user.email;

}

async function updatePassword(){

const password=document.getElementById("newPassword").value;
const confirm=document.getElementById("confirmPassword").value;

const msg=document.getElementById("resetMessage");

if(password.length<8){
msg.innerText="Password kam az kam 8 characters ka ho.";
return;
}

if(password!==confirm){
msg.innerText="Passwords match nahi karte.";
return;
}

const {error}=await client.auth.updateUser({
password:password
});

if(error){
msg.innerText=error.message;
return;
}

msg.style.color="green";
msg.innerText="Password successfully updated!";

setTimeout(async()=>{
await client.auth.signOut();
document.getElementById("resetBox").style.display="none";
document.getElementById("loginBox").style.display="block";
},2000);

}

async function logout(){

await client.auth.signOut();

document.getElementById("dashboard").style.display="none";
document.getElementById("loginBox").style.display="block";

}

client.auth.onAuthStateChange((event,session)=>{

if(event==="PASSWORD_RECOVERY"){
document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="none";
document.getElementById("resetBox").style.display="block";
}

});

async function checkSession(){

const {data}=await client.auth.getSession();

if(data.session){
showDashboard(data.session.user);
}

}

checkSession();

</script>

</body>
</html>
